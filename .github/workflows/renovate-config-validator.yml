name: renovate-config-validator

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

jobs:
  config-files:
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.file_list.outputs.files }}

    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4

      - name: Find JSON files
        id: file_list
        run: |
          set -x
          files=$(find . -type f -name "*.json" | sed 's|^\./||')
          files_json=$(echo "$files" | jq -R -s -c 'split("\n")[:-1]')
          echo "files=$files_json" >> $GITHUB_OUTPUT

  validate:
    needs: config-files
    runs-on: ubuntu-latest
    strategy:
      matrix:
        file: ${{ fromJson(needs.config-files.outputs.files) }}
    steps:
      - uses: actions/checkout@eef61447b9ff4aafe5dcd4e0bbf5d482be7e7871 # v4
      - uses: suzuki-shunsuke/github-action-renovate-config-validator@36a15b83e37bf3221dc9c02ff5ffdaefb51ca1cf # v1.1.0
        with:
          config_file_path: ${{ matrix.file }}
